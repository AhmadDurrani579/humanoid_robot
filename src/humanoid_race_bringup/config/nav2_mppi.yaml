controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 20.0
    costmap_update_timeout: 0.5
    odom_topic: /odometry/filtered

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.5

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.50

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      time_steps: 60
      model_dt: 0.05
      batch_size: 1200
      iteration_count: 1

      motion_model: "DiffDrive"

      vx_max: 1.50
      vx_min: 0.00
      vy_max: 0.00
      wz_max: 1.2

      ax_max: 0.80
      ax_min: -0.60
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.5

      vx_std: 0.30
      vy_std: 0.0
      wz_std: 0.25

      temperature: 0.30
      gamma: 0.015

      prune_distance: 5.0
      transform_tolerance: 0.30

      visualize: true
      publish_optimal_trajectory: true
      regenerate_noises: true
      open_loop: false

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
        - VelocityDeadbandCritic


      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.5
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.8

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 2
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        offset_from_furthest: 5
        threshold_to_consider: 1.8

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 1.0
        offset_from_furthest: 5
        max_angle_to_furthest: 0.8
        mode: 0

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        deadband_velocities: [0.30, 0.0, 0.05]
      


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: map
      robot_base_frame: pelvis

      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05

      robot_radius: 0.40
      transform_tolerance: 0.30

      plugins:
        - obstacle_layer
        - voxel_layer
        - inflation_layer


      # --------------------------------------------------
      # 2D LiDAR - KEEP EXISTING STABLE CONFIGURATION
      # --------------------------------------------------

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.20
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
          max_obstacle_height: 2.0

      # --------------------------------------------------
      # RGB-D CAMERA - 3D VOXEL LAYER
      # --------------------------------------------------

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true

        footprint_clearing_enabled: true

        # Enable temporarily so we can debug the 3D voxel map.
        publish_voxel_map: true

        # H1 navigation-relevant vertical space:
        # 16 × 0.125 m = 2.0 m
        origin_z: 0.0
        z_resolution: 0.125
        z_voxels: 16

        min_obstacle_height: 0.15
        max_obstacle_height: 2.0

        unknown_threshold: 15
        mark_threshold: 0

        combination_method: 1

        # Split into two sources off the SAME camera:
        #   *_mark  -> what becomes an obstacle
        #   *_clear -> what is allowed to raytrace free space
        observation_sources: pointcloud_mark pointcloud_clear

        pointcloud_mark:
          topic: /camera/depth/points_realistic
          # switch to /camera/depth/points_ground_filtered
          # ONLY after the ground filter log is verified
          data_type: "PointCloud2"
          transport_type: "raw"

          marking: true
          clearing: false

          min_obstacle_height: 0.15
          max_obstacle_height: 2.0

          obstacle_min_range: 0.60
          obstacle_max_range: 5.0

          raytrace_min_range: 0.60
          raytrace_max_range: 6.0

        pointcloud_clear:
          topic: /camera/depth/points_realistic
          data_type: "PointCloud2"
          transport_type: "raw"

          marking: false
          clearing: true

          # Ground points MUST survive ObservationBuffer::bufferCloud
          # or there are no rays to clear the corridor with.
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0

          obstacle_min_range: 0.60
          obstacle_max_range: 5.0

          raytrace_min_range: 0.60
          raytrace_max_range: 6.0

      # --------------------------------------------------
      # EXISTING INFLATION
      # --------------------------------------------------

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.70
        cost_scaling_factor: 4.0

      always_send_full_costmap: true